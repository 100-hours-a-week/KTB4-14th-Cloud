apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-staging-test
  namespace: app
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-auth-staging
    kind: SecretStore
  target:
    name: auth-staging-test
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: payload
      remoteRef:
        key: audigo/k8s/auth/staging
