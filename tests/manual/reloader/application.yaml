apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader-check
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-14th-Cloud.git
    targetRevision: main
    path: tests/manual/reloader/workload
  destination:
    server: https://kubernetes.default.svc
    namespace: auth-staging
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: reloader-check
      namespace: auth-staging
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
