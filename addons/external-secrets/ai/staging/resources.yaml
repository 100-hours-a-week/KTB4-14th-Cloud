# AI staging용 SecretStore. 시크릿과 IAM 역할은 production과 같이 쓴다.

apiVersion: v1
kind: Namespace
metadata:
  name: ai-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-ai
  namespace: ai-staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      role: arn:aws:iam::185489190599:role/audigo-eso-ai-production

---
# ECR 로그인 토큰 생성기. 위 SecretStore와 같은 IAM 역할로 토큰을 발급한다.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-token
  namespace: ai-staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  region: ap-northeast-2
  role: arn:aws:iam::185489190599:role/audigo-eso-ai-production

---
# 이미지 pull용 Secret(ai-image-pull). 토큰 유효기간이 12시간이라 6시간마다 갱신한다.
# Pod는 values의 imagePullSecrets로 이 Secret을 참조한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-image-pull
  namespace: ai-staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 6h
  target:
    name: ai-image-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .proxy_endpoint }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-token
