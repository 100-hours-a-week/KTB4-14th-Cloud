apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: aws-monitoring
    kind: SecretStore

  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque

  data:
    - secretKey: admin-user
      remoteRef:
        key: audigo/k8s/monitoring
        property: GRAFANA_ADMIN_USER

    - secretKey: admin-password
      remoteRef:
        key: audigo/k8s/monitoring
        property: GRAFANA_ADMIN_PASSWORD