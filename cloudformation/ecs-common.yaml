AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Audigo 기존 운영 및 스테이징 ECS 클러스터 2개의 편입용 템플릿입니다.
  일반 생성이 아닌 IMPORT로 사용하며, 서비스와 IAM 역할은 이번 범위에 포함하지 않습니다.

# 작성 기준: 2026-10-14 사용자가 제공한 AWS CLI 조회 결과입니다.
# 기존 클러스터의 이름, 태그, 설정을 유지하고 신규 Outputs는 추가하지 않습니다.
# 실행 태스크 수와 등록 EC2 수는 조회 상태이므로 템플릿 속성으로 선언하지 않습니다.
Resources:
  AudigoEcsCluster:
    Type: AWS::ECS::Cluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ClusterName: audigo-ecs-cluster
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      # 기존 연결을 유지합니다. 공급자 연결만으로 서비스의 실행 방식은 바뀌지 않습니다.
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      # 실제 기본 전략이 비어 있으므로 Fargate 기본 전략을 새로 지정하지 않습니다.
      DefaultCapacityProviderStrategy: []
      Tags:
        # 소문자 name은 기존 태그 키입니다. Name으로 변경하지 않습니다.
        - Key: name
          Value: ecs-on-ec2
        - Key: version
          Value: v1

  AudigoStagingEcsCluster:
    Type: AWS::ECS::Cluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ClusterName: audigo-staging-ecs-cluster
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy: []
      # 기존 스테이징 클러스터에는 태그가 없습니다.

# CapacityProviders는 위 Cluster 속성으로 관리하므로 별도 연결 리소스를 중복 선언하지 않습니다.
# FARGATE/FARGATE_SPOT는 AWS 기본 제공 공급자이며 새 CapacityProvider를 만들지 않습니다.
