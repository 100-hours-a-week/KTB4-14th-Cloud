# AI Worker ECS Service 편입(IMPORT) 템플릿입니다.
# 작성 기준: 2026-10-18 사용자가 제공한 `aws ecs describe-services` 조회 결과 (audigo-mock-ai-service).
# 관리 경계:
# - 이 스택: ECS Service의 배포 방식·배포 설정·태그 설정
# - ai-deploy.yml: Task Definition 리비전 등록, 이미지, 환경 변수, taskRoleArn, SSM 활성 Worker 버전
# - 실행 태스크 개수: 현재 Auto Scaling이 없으며 DesiredCount를 선언하지 않습니다(현재 값 유지).
# Service는 Task Definition family 이름만 참조합니다(최신 ACTIVE 리비전). 리비전 번호를 고정하지 않습니다.
# 조회 값은 그대로 옮겼습니다. 운영 설정 변경은 IMPORT 이후 별도 PR로 검토합니다.
---
AWSTemplateFormatVersion: '2010-09-09'
Description: Audigo AI Worker ECS Service 관리 템플릿. Task Definition과 활성 버전은 ai-deploy.yml이 관리합니다.
Resources:
  AudigoAiService:
    Type: AWS::ECS::Service
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Cluster: audigo-ecs-cluster
      ServiceName: audigo-mock-ai-service
      # 리비전 없이 family만 지정합니다. 리비전 등록은 ai-deploy.yml이 담당합니다.
      TaskDefinition: audigo-mock-ai
      LaunchType: EC2
      SchedulingStrategy: REPLICA
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
          ResetOnHealthyTask: false
          ThresholdConfiguration:
            Type: BOUNDED_PERCENT
            Value: 50
        # 조회된 현재 값입니다. ai-deploy.yml의 "신규 Worker 먼저 실행 후 기존 Worker 드레이닝" 흐름과
        # 맞지 않을 수 있어 docs/ai-api-import.md의 확인 사항에 기록했습니다. IMPORT에서는 변경하지 않습니다.
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        Strategy: ROLLING
        BakeTimeInMinutes: 0
      HealthCheckGracePeriodSeconds: 0
      # ECS는 PropagateTags NONE을 반환하지만 CloudFormation은 SERVICE/TASK_DEFINITION만 허용하므로 생략합니다.
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      AvailabilityZoneRebalancing: DISABLED
      # 로드 밸런서, 서비스 디스커버리, awsvpc 네트워크 설정은 조회 결과 없음
