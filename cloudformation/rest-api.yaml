# 최종 관리 템플릿: 기존 Service, ScalableTarget 편입 내용을 유지합니다.
# 2026-10-18 관리 범위 변경: Task Definition은 BE 레포 CD가 관리하므로 이 스택에서 제외했습니다.
# - Service는 Task Definition family 이름만 참조합니다(최신 ACTIVE 리비전).
# - 실행 태스크 개수는 Auto Scaling이 관리하므로 DesiredCount를 선언하지 않습니다.
# - 배포에 실패한 리비전은 BE CD가 deregister해서 최신으로 남지 않게 합니다.
# 단계별 Import JSON은 작업 이력이며, 이후 변경의 기준 파일은 이 YAML입니다.
---
AWSTemplateFormatVersion: '2010-09-09'
Description: Audigo REST API ECS Service와 Auto Scaling 관리 템플릿. Task Definition은 BE 레포 CD가 관리합니다.
Resources:
  AudigoRestService:
    Type: AWS::ECS::Service
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Cluster: audigo-ecs-cluster
      ServiceName: audigo-backend-Fargate-service
      # 리비전 없이 family만 지정합니다. 배포 시점의 최신 ACTIVE 리비전을 사용합니다.
      # 리비전 등록과 이미지·환경 변수·taskRoleArn은 BE 레포 CD가 관리합니다.
      TaskDefinition: audigo-backend-Fargate
      LaunchType: FARGATE
      SchedulingStrategy: REPLICA
      PlatformVersion: 1.4.0
      AvailabilityZoneRebalancing: ENABLED
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
          - sg-0da962a4706dacd5f
          Subnets:
          - subnet-0b9604514010cbb54
          - subnet-06bb5908818e1bc74
      LoadBalancers:
      - TargetGroupArn: arn:aws:elasticloadbalancing:ap-northeast-2:185489190599:targetgroup/audigo-v1-Fargate/53f2677044a1644f
        ContainerName: spring-boot
        ContainerPort: 8080
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
          ResetOnHealthyTask: true
          ThresholdConfiguration:
            Type: COUNT
            Value: 3
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        Strategy: ROLLING
        BakeTimeInMinutes: 5
      DeploymentController:
        Type: ECS
      HealthCheckGracePeriodSeconds: 0
      EnableECSManagedTags: true
      EnableExecuteCommand: false
  AudigoRestScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceNamespace: ecs
      ResourceId: service/audigo-ecs-cluster/audigo-backend-Fargate-service
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 1
      MaxCapacity: 2
      RoleARN: arn:aws:iam::185489190599:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      SuspendedState:
        DynamicScalingInSuspended: false
        DynamicScalingOutSuspended: false
        ScheduledScalingSuspended: false
    DependsOn: AudigoRestService
