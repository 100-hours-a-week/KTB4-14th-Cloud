apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-api-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-14th-Cloud.git
    targetRevision: main
    path: apps/chart
    helm:
      releaseName: auth-api
      valueFiles:
        - ../spring-value/auth-api-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: auth-staging
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: auth-api
      namespace: auth-staging
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
