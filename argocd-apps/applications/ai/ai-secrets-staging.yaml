apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-secrets-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-14th-Cloud.git
    targetRevision: main
    path: addons/external-secrets/ai/staging
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
