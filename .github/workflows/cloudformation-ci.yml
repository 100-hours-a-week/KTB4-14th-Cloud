name: CloudFormation CI
run-name: "[INFRA CI] ${{ github.event.pull_request.title || github.event.head_commit.message || '수동 검증' }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: 검증 도구 설치
        run: python -m pip install -r deploy/requirements-ci.txt
      - name: 배포 설정과 전체 템플릿 검증
        run: python scripts/infra.py validate --config deploy/stacks.json --lint
      - name: 별도 관리자용 IAM 템플릿 검증
        run: cfn-lint bootstrap/infra-iam.yaml
      - name: 배포 안전장치 테스트
        run: python -m unittest discover -s tests -v
