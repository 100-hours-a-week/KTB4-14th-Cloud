name: CloudFormation CD
run-name: "[INFRA CD] ${{ github.event_name == 'workflow_dispatch' && inputs.stack || '활성 스택 전체' }}"

on:
  push:
    branches: [main]
    paths:
      - 'cloudformation/**'
      - 'deploy/**'
      - 'scripts/infra*.py'
      - 'tests/test_infra*.py'
      - '.github/workflows/cloudformation-cd.yml'
      - '.github/workflows/cloudformation-ci.yml'
  workflow_dispatch:
    inputs:
      stack:
        description: 'all은 활성 스택 전체 계획입니다. 변경 파일 자동 감지는 하지 않으며, 개별 스택은 재시도/검증용입니다.'
        type: choice
        required: true
        default: all
        options:
          - all
          - audigo-network
          - audigo-db
          - audigo-cache
          - audigo-sqs
          - audigo-alb
          - audigo-frontend
          - audigo-ecs-common
          - audigo-rest-api
          - audigo-websocket
          - audigo-ai-api
          - audigo-monitoring

permissions:
  contents: read

# 운영 인프라 배포를 직렬화한다. 진행 중인 업데이트를 취소하지 않는다.
concurrency:
  group: cloudformation-production
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: iac-plan
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_STACK: ${{ inputs.stack || 'all' }}
      DEPLOY_COMMIT: ${{ github.sha }}
      INFRA_CORE_CFN_ROLE_ARN: ${{ vars.INFRA_CORE_CFN_ROLE_ARN }}
      INFRA_PLATFORM_CFN_ROLE_ARN: ${{ vars.INFRA_PLATFORM_CFN_ROLE_ARN }}
      INFRA_APP_CFN_ROLE_ARN: ${{ vars.INFRA_APP_CFN_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/requirements-ci.txt
      - name: AWS 인증 전 전체 검증
        run: |
          python scripts/infra.py validate --config deploy/stacks.json --lint
          python -m unittest discover -s tests -v
      - name: 운영 배포 준비 확인
        env:
          DEPLOY_ENABLED: ${{ vars.INFRA_DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" != 'true' ]; then
            echo 'IAM/Environment 승인 설정을 완료한 뒤 INFRA_DEPLOY_ENABLED=true를 설정하세요.' >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '185489190599'
          role-session-name: iac-plan-${{ github.run_id }}
      - name: Change Set 생성 및 안전성 검사
        id: changes
        run: python scripts/infra_batch.py plan --config deploy/stacks.json --stack "$TARGET_STACK" --commit "$DEPLOY_COMMIT" --report plan.json
      - name: 검토 결과 표시
        run: |
          echo '### CloudFormation 변경 계획' >> "$GITHUB_STEP_SUMMARY"
          echo '아래 Artifact의 plan.json과 AWS Change Set을 검토한 뒤 apply를 승인하세요.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat plan.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudformation-plan-${{ github.run_id }}
          path: plan.json
          if-no-files-found: error
          retention-days: 7

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # 이 Environment에 Required reviewers/main 제한을 반드시 설정한다.
    environment: iac-production
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_STACK: ${{ inputs.stack || 'all' }}
      DEPLOY_COMMIT: ${{ github.sha }}
      INFRA_CORE_CFN_ROLE_ARN: ${{ vars.INFRA_CORE_CFN_ROLE_ARN }}
      INFRA_PLATFORM_CFN_ROLE_ARN: ${{ vars.INFRA_PLATFORM_CFN_ROLE_ARN }}
      INFRA_APP_CFN_ROLE_ARN: ${{ vars.INFRA_APP_CFN_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cloudformation-plan-${{ github.run_id }}
          path: reviewed-plan
      - name: 운영 배포 준비 확인
        env:
          DEPLOY_ENABLED: ${{ vars.INFRA_DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" != 'true' ]; then
            echo 'IAM/Environment 승인 설정을 완료한 뒤 INFRA_DEPLOY_ENABLED=true를 설정하세요.' >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '185489190599'
          role-session-name: iac-apply-${{ github.run_id }}
      - name: 승인된 동일 Change Set 실행 및 완료 대기
        run: python scripts/infra_batch.py apply --config deploy/stacks.json --stack "$TARGET_STACK" --commit "$DEPLOY_COMMIT" --report reviewed-plan/plan.json
