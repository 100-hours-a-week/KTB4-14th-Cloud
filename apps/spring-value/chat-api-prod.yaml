# apps/spring-value/chat-api-prod.yaml

labels:
  service: chat
  env: prod
  component: api

replicaCount: 1

image:
  repository: mingkiboo/audigo-backend
  digest: sha256:e80614ebfd820ca6222337df54dde2810bd31a38e5474268a734c7bbd3a7b61d

  tag: sha-aba155c7735f609f1cfb6897b3380d9145f5680a
containerPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    memory: 2Gi

configMap:
  enabled: true
  data:
    AUDIGO_ENVIRONMENT: "prod"
    AUDIGO_CORS_ALLOWED_ORIGINS: "https://audigo.kr"

    # 운영 MySQL
    SPRING_DATASOURCE_URL: "jdbc:mysql://audigo-prd-db.c52se0u48luz.ap-northeast-2.rds.amazonaws.com:3306/audigo"
    DB_USERNAME: "audigo_app"

    # 기존 테이블 검증만 수행
    JPA_DDL_AUTO: "validate"
    SPRING_SQL_INIT_MODE: "never"

    # DB 커넥션 풀
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "6"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"

    # 공유 Redis
    SPRING_DATA_REDIS_HOST: "audigo-session-aofpfb.serverless.apn2.cache.amazonaws.com"
    SPRING_DATA_REDIS_PORT: "6379"
    SPRING_DATA_REDIS_USERNAME: "audigo"
    SPRING_DATA_REDIS_SSL_ENABLED: "true"

    # 운영 큐
    AUDIGO_SQS_ENABLED: "false"
    AWS_REGION: "ap-northeast-2"
    AUDIGO_AI_JOB_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/185489190599/Audigo-AI-Job-Queue"
    AUDIGO_AI_RESULT_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/185489190599/Audigo-AI-Result-Queue"

    ELASTICSEARCH_URL: "https://elasticsearch-data.elasticsearch.svc.cluster.local:9200"

    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus"
    SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"

    # ES
    AUDIGO_CHAT_SEARCH_SYNC_RECORD_ENABLED: true
    AUDIGO_CHAT_SEARCH_SYNC_WORKER_ENABLED: true
    AUDIGO_CHAT_MESSAGE_SEARCH_MODE: es
    SPRING_PROFILES_ACTIVE: "prod, search-server"

# 기존 ESO 리소스를 재사용하므로 차트에서 새로 생성하지 않음
externalSecret:
  enabled: false

reloader:
  existingSecretNames:
    - backend-secrets
    - chat-api-elasticsearch

# 같은 Namespace의 기존 Secret 연결
envFrom:
  - secretRef:
      name: backend-secrets
  - secretRef:
      name: chat-api-elasticsearch

service:
  type: NodePort
  externalTrafficPolicy: Local

ingress:
  enabled: true
  className: alb
  group: audigo
  host: api.audigo.kr
  paths:
    - path: /api/v2/chat/rooms
      pathType: Prefix
    - path: /api/v2/match-connections
      pathType: Prefix
  annotations:
    alb.ingress.kubernetes.io/group.order: "40"
    alb.ingress.kubernetes.io/target-type: "instance"
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
    alb.ingress.kubernetes.io/backend-protocol-version: "HTTP1"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:185489190599:certificate/09c54455-a23b-4a9b-b0f4-422e3746fc70"

autoscaling:
  enabled: false

# Prometheus 메트릭 수집 (Spring Actuator)
metrics:
  enabled: true
  path: /actuator/prometheus

networkPolicy:
  enabled: true
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/20
        - ipBlock:
            cidr: 10.0.16.0/20
      ports:
        - port: 8080
          protocol: TCP

probes:
  path: ""
  startup:
    path: /actuator/health
  readiness:
    path: /actuator/health
