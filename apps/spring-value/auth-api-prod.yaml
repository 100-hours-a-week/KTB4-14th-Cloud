# apps/spring-value/auth-api-prod.yaml

labels:
  service: auth
  env: prod
  component: api

replicaCount: 1

image:
  repository: mingkiboo/audigo-backend
  digest: sha256:4266dd856251eae6e2a04b32786e8a78326e5012bce93da0beb309c588de8da7

  tag: sha-f6dbcb95c7e89c95dd413e8851d039ea31a480bb
containerPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    memory: 2Gi

configMap:
  enabled: true
  data:
    AUDIGO_ENVIRONMENT: "prod"
    AUDIGO_CORS_ALLOWED_ORIGINS: "https://audigo.kr"
    KAKAO_REDIRECT_URI: "https://audigo.kr/auth/kakao"

    # 운영 MySQL
    SPRING_DATASOURCE_URL: "jdbc:mysql://audigo-prd-db.c52se0u48luz.ap-northeast-2.rds.amazonaws.com:3306/audigo"
    DB_USERNAME: "audigo_app"

    # 기존 테이블 검증만 수행
    JPA_DDL_AUTO: "validate"
    SPRING_SQL_INIT_MODE: "never"

    # DB 커넥션 풀
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "6"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"

    # 공유 Redis
    SPRING_DATA_REDIS_HOST: "audigo-session-aofpfb.serverless.apn2.cache.amazonaws.com"
    SPRING_DATA_REDIS_PORT: "6379"
    SPRING_DATA_REDIS_USERNAME: "audigo"
    SPRING_DATA_REDIS_SSL_ENABLED: "true"

    # 운영 큐
    AUDIGO_SQS_ENABLED: "false"
    AWS_REGION: "ap-northeast-2"
    AUDIGO_AI_JOB_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/185489190599/Audigo-AI-Job-Queue"
    AUDIGO_AI_RESULT_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/185489190599/Audigo-AI-Result-Queue"

    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus"

    SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"

# 기존 ESO 리소스를 재사용하므로 차트에서 새로 생성하지 않음
externalSecret:
  enabled: false

reloader:
  existingSecretNames:
    - backend-secrets

# 같은 Namespace의 기존 Secret 연결
envFrom:
  - secretRef:
      name: backend-secrets

service:
  type: NodePort
  externalTrafficPolicy: Local

ingress:
  enabled: true
  className: alb
  group: audigo
  host: api.audigo.kr
  path: /users
  annotations:
    alb.ingress.kubernetes.io/group.order: "30"
    alb.ingress.kubernetes.io/target-type: "instance"
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
    alb.ingress.kubernetes.io/backend-protocol-version: "HTTP1"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:185489190599:certificate/09c54455-a23b-4a9b-b0f4-422e3746fc70"

autoscaling:
  enabled: false

# Prometheus 메트릭 수집 (Spring Actuator)
metrics:
  enabled: true
  path: /actuator/prometheus

networkPolicy:
  enabled: true
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/20
        - ipBlock:
            cidr: 10.0.16.0/20
      ports:
        - port: 8080
          protocol: TCP

probes:
  path: ""
  startup:
    path: /actuator/health
  readiness:
    path: /actuator/health
