# apps/spring-value/chat-ws-staging.yaml

labels:
  service: chat
  env: staging
  component: ws

replicaCount: 1

image:
  repository: mingkiboo/audigo-backend
  digest: sha256:e80614ebfd820ca6222337df54dde2810bd31a38e5474268a734c7bbd3a7b61d

  tag: sha-aba155c7735f609f1cfb6897b3380d9145f5680a
containerPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    memory: 2Gi

configMap:
  enabled: true
  data:
    AUDIGO_AI_BASE_URL: "http://ai.ai-staging.svc.cluster.local:8000"
    KAKAO_REDIRECT_URI: "https://dev.audigo.kr/auth/kakao"
    AUDIGO_CORS_ALLOWED_ORIGINS: "https://dev.audigo.kr"
    AUDIGO_ENVIRONMENT: "staging"

    # 스테이징 MySQL
    SPRING_DATASOURCE_URL: "jdbc:mysql://10.0.9.35:3306/audigo"
    DB_USERNAME: "audigo_app"

    # 기존 테이블 검증만 수행
    JPA_DDL_AUTO: "validate"
    SPRING_SQL_INIT_MODE: "never"

    # DB 커넥션 풀
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "6"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"

    # 공유 Redis
    AUDIGO_REDIS_HOST: "audigo-session-aofpfb.serverless.apn2.cache.amazonaws.com"
    AUDIGO_REDIS_PORT: "6379"
    AUDIGO_REDIS_USERNAME: "audigo"
    AUDIGO_REDIS_SSL_ENABLED: "true"

    # 스테이징 큐 사용 안 함
    AUDIGO_SQS_ENABLED: "false"

    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus"
    SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"

# 기존 ESO 리소스를 재사용하므로 차트에서 새로 생성하지 않음
externalSecret:
  enabled: false

reloader:
  existingSecretNames:
    - backend-secrets

# 같은 Namespace의 기존 Secret 연결
envFrom:
  - secretRef:
      name: backend-secrets

service:
  type: NodePort

ingress:
  enabled: true
  className: alb
  group: audigo
  host: staging.audigo.kr
  path: /ws/chat
  annotations:
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/target-type: "instance"
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
    alb.ingress.kubernetes.io/backend-protocol-version: "HTTP1"
    alb.ingress.kubernetes.io/healthcheck-path: "/actuator/health"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:185489190599:certificate/c64db7c8-3947-4cec-ab6c-ffcefec62cab"

autoscaling:
  enabled: false

# Prometheus 메트릭 수집 (Spring Actuator)
metrics:
  enabled: true
  path: /actuator/prometheus

networkPolicy:
  enabled: false

probes:
  path: ""
  startup:
    path: /actuator/health
  readiness:
    path: /actuator/health
