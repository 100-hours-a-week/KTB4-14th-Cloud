{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret }}
{{- $remoteKey := required "externalSecret.remoteKey를 지정해 주세요" $es.remoteKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app-chart.secretName" . }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
spec:
  refreshPolicy: Periodic
  {{- with $es.refreshInterval }}
  refreshInterval: {{ . | quote }}
  {{- end }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ required "externalSecret.secretStoreRef.name을 지정해 주세요" $es.secretStoreRef.name | quote }}
  target:
    name: {{ include "app-chart.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- if $es.data }}
  # data를 지정하면 그 키만 가져옵니다.
  data:
    {{- range $es.data }}
    - secretKey: {{ required "externalSecret.data[].secretKey를 지정해 주세요" .secretKey | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ .property | default .secretKey | quote }}
    {{- end }}
  {{- else }}
  # data가 비어 있으면 원격 Secret(JSON)의 모든 키를 그대로 가져옵니다.
  dataFrom:
    - extract:
        key: {{ $remoteKey | quote }}
  {{- end }}
{{- end }}
