{{- /*
Prometheus 수집 대상 등록
- Service가 있으면 ServiceMonitor, 없으면(워커 등) PodMonitor를 생성
- release 라벨은 kube-prometheus-stack의 serviceMonitorSelector/podMonitorSelector와 일치해야 수집됨
*/}}
{{- if .Values.metrics.enabled }}
{{- if not .Values.containerPort }}
{{- fail "metrics를 사용하려면 containerPort를 지정해 주세요" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: {{ ternary "ServiceMonitor" "PodMonitor" .Values.service.enabled }}
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "app-chart.selectorLabels" . | nindent 6 }}
  {{ ternary "endpoints" "podMetricsEndpoints" .Values.service.enabled }}:
    - port: http # Service/컨테이너 포트 이름
      path: {{ required "metrics.path를 지정해 주세요" .Values.metrics.path | quote }}
      interval: {{ .Values.metrics.interval }}
      scrapeTimeout: {{ .Values.metrics.scrapeTimeout }}
{{- end }}
