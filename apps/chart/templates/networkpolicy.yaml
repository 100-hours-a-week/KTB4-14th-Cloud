{{- if .Values.networkPolicy.enabled }}
{{- $policy := .Values.networkPolicy }}
{{- if not $policy.policyTypes }}
{{- fail "networkPolicy.policyTypes에 Ingress 또는 Egress를 지정해 주세요" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app-chart.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml $policy.policyTypes | nindent 4 }}
  {{- if has "Ingress" $policy.policyTypes }}
  ingress:
    {{- with $policy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $.Values.metrics.enabled }}
    # 메트릭 수집: monitoring 네임스페이스의 Prometheus 파드만 허용 (metrics.enabled면 자동 추가)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: {{ $.Values.containerPort }}
          protocol: TCP
    {{- else if not $policy.ingress }}
    []
    {{- end }}
  {{- end }}
  {{- if has "Egress" $policy.policyTypes }}
  egress:
    {{- toYaml (default (list) $policy.egress) | nindent 4 }}
  {{- end }}
{{- end }}
