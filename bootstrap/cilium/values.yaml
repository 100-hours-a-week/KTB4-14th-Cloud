bpf:
  masquerade: true
enableIPv4Masquerade: true
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv4PodCIDRList:
    - 10.1.0.0/16
k8sServiceHost: 10.0.0.246
k8sServicePort: 6443
kubeProxyReplacement: true
operator:
  replicas: 1
  rollOutPods: true
rollOutCiliumPods: true
routingMode: tunnel
tunnelProtocol: vxlan
